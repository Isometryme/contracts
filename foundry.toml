[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc = "0.8.38"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
ignored_error_codes = [6335]
# the deterministic deep run needs far more than the default test gas
gas_limit = 9223372036854775807

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 120
fail_on_revert = false
show_metrics = true

[lint]
lint_on_build = false
